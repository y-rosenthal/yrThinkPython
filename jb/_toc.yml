- caption: Front Matter
  chapters:
  - file: chap00
  - file: yr/prof_r_intro
- caption: Chapters
  numbered: True
  chapters:
    - file: chap01
    - file: chap02
# The yr/ pages of a chapter (any number: "Additions: TOPIC" pages, then "Review: TOPIC" pages, lettered
# b, c, d, ... in this order) sit in their own
# unnumbered part right after the chapter, so they show up in the sidebar under that chapter
# without changing the book's chapter numbers (numbering continues across the numbered parts).
# See yr/README.md.
- chapters:
