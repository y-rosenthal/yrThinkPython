# Book settings
title: Think Python
author: Allen B. Downey

latex:
  latex_documents:
    targetname: book.tex

execute:
  execute_notebooks: 'off'

repository:
  url: https://github.com/y-rosenthal/yrThinkPython
  branch: v3
html:
  baseurl: https://y-rosenthal.github.io/yrThinkPython/
  use_repository_button: true

  extra_footer: |
    <div style="text-align: left;">
      <a rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/">
        <img alt="Creative Commons License" style="border-width:0"
             src="https://i.creativecommons.org/l/by-nc-sa/4.0/88x31.png" />
      </a>
      <br />
      This work is licensed under a
      <a rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/">
        Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International License
      </a>.
    </div>

parse:
  # myst_extended_syntax: true  # instead enable individual features below
  myst_enable_extensions:  # https://myst-parser.readthedocs.io/en/latest/using/syntax-optional.html
    - amsmath
    # - attrs_inline  # causing the conflict with dollarmath
    - colon_fence
    - deflist
    - dollarmath
    - fieldlist
    - html_admonition
    - html_image
    - linkify
    - replacements
    - smartquotes
    - strikethrough
    - substitution
    - tasklist

sphinx:
  # Merge html_theme_options below into the ones JB sets (repository button, search text)
  # instead of replacing them.
  recursive_update: true
  # Sitemap and link previews (from Downey's site); page descriptions are in
  # descriptions.yml (notebooks) and the front matter of index.md and blank.md
  extra_extensions:
    - sphinx_sitemap
    - sphinxext.opengraph
  config:
    html_baseurl: https://y-rosenthal.github.io/yrThinkPython/
    sitemap_url_scheme: "{link}"
    sitemap_excludes: [genindex.html, search.html]
    ogp_site_url: https://y-rosenthal.github.io/yrThinkPython/
    ogp_site_name: Think Python, 3rd edition
    ogp_image: https://raw.githubusercontent.com/AllenDowney/ThinkPython/v3/think_python_3e.jpg
    ogp_image_alt: Cover of Think Python, 3rd edition, by Allen B. Downey
    ogp_enable_meta_description: false
    # Downey's site also has a page-view counter, an end-of-chapter support note, an EthicalAds slot and a
    # sponsor slot; the course site does not take them (sync-upstream skill, check_sync.py NOT_TAKEN).
    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    mathjax_config:
      tex2jax:
        inlineMath: [["$","$"], ["\\(", "\\)"]]
    myst_update_mathjax: false
    # files copied as they are to the top of the website: yr/chap07_additions.ipynb links to
    # https://y-rosenthal.github.io/yrThinkPython/words.txt, so students can download the word list
    html_extra_path: ['../words.txt']
    # subjexts (yrS4) teaching overlay: coverage marks, notes and the panel on every page of the published
    # book. TWO LINES: uncomment the next two lines to turn it on, comment them out again to remove it
    # completely. The script comes from https://subjexts.github.io/, holds no key, fails silently, and does
    # nothing if the package is disabled on the platform.
    html_js_files:
      - ["https://subjexts.github.io/overlay/v1/yrS4.js", {"data-package": "y-rosenthal/thinkpython", "defer": "defer"}]
